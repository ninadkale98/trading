# General settings (safe for code and the user to tune). Hard limits live in limits.yaml.

timezone: America/New_York

database:
  dsn: "dbname=market"           # local PostgreSQL via Unix socket

data:
  history_start: "2016-01-01"     # Alpaca SIP daily history starts in 2016
  news_backfill_days: 730
  # index, sector, theme, style, bond/credit, commodity/currency and global ETFs (grouped in core/market/groups.py)
  reference_symbols: [SPY, QQQ, IWM, DIA, RSP, MDY, XLK, XLV, XLF, XLE, XLI, XLY, XLP, XLU, XLB, XLRE, XLC, SMH, SOXX, IGV, CIBR, SKYY, BOTZ, XBI, IBB, ITA, KRE, XHB, XRT, JETS, XOP, TAN, URA, LIT, COPX, PAVE, ARKK, IWF, IWD, MTUM, QUAL, USMV, SHY, IEF, TLT, TIP, LQD, HYG, GLD, SLV, USO, UNG, DBC, CPER, UUP, IBIT, VIXY, VGK, EWJ, FXI, INDA, EWZ, EWY, EWT, EEM]
  universe_exchanges: [NASDAQ, NYSE, AMEX, ARCA, BATS]

alpaca:
  data_url: "https://data.alpaca.markets"
  trading_url: "https://paper-api.alpaca.markets"
  requests_per_minute: 180        # plan limit is 200; keep headroom
  sip_delay_minutes: 16           # free plan: SIP requests must end ≥ 15 min in the past

sec:
  requests_per_second: 8          # SEC asks ≤ 10/s

alphavantage:
  requests_per_day: 25            # free plan cap; every call is counted in api_usage

workers:
  threads: 8
  poll_seconds: 2
  heartbeat_seconds: 60

retry:
  backoff_seconds: [60, 300, 900, 3600, 10800]   # 1m, 5m, 15m, 1h, 3h
  max_attempts: 6

features:
  store_from: "2024-01-01"        # features are stored from here on; older dates are recomputed on demand (backtests)

trading:
  mode: dry_run                   # dry_run = simulate plans against real prices (no orders) · paper = Alpaca PAPER orders
  max_positions: 20
  max_new_per_strategy_per_day: 2
  entry_limit_above_close: 0.01   # buy limit = yesterday's close + 1% (don't chase big gaps)

ai:
  # Optional daily caps per model, in pay-per-use-equivalent dollars. Empty = NO cap (user's decision 2026-11-08: the
  # Max plan's own 5-hour/weekly limits are the only limit; hitting one pauses that model's queue until it resets).
  # Usage is still metered in ai_usage (dashboard → Live). To cap again: {haiku: 3.0, sonnet: 8.0, opus: 6.0}
  daily_budget_usd_equiv: {}

dashboard:
  host: "127.0.0.1"               # local only; open through VS Code port forwarding
  port: 8090
  tailnet_hosts: ["100.85.155.36"]   # ichigo's private Tailscale address → http://ichigo:8090 from other tailnet devices
