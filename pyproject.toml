[project]
name = "tradebot"
version = "0.1.0"
description = "Market research & paper-trading system (see docs/architecture.md)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary,pool]==3.2.3",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
tradebot = "core.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
core = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
